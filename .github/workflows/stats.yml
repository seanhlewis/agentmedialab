name: Export click stats

# Pulls anonymous click totals from GoatCounter into data/stats.json, which the Stats tab reads.
# Does nothing until the GOATCOUNTER_CODE and GOATCOUNTER_TOKEN repository secrets exist.
on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export
        env:
          GOATCOUNTER_CODE: ${{ secrets.GOATCOUNTER_CODE }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python -I tools/export_stats.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/stats.json; then echo "no change"; exit 0; fi
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          git commit -m "Update click stats"
          git push
